name: add-cla-user

# Usage (maintainers only), as a PR comment:
#   /approve-cla <org>
# e.g. `/approve-cla Anchorage` or `/approve-cla Distributed Lab`.
# Adds the PR author to .cla-signed-users under the `# <org>` section
# (case-insensitive; a header like `# Anchorage maintainers` matches
# `Anchorage`), creating the section if it doesn't exist yet.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

# No `concurrency:` group: GitHub keeps only one pending run per group and
# cancels older pending ones, which would silently drop a signer during a burst
# of approvals. Instead, concurrent runs race on the shared `cla-signers-batch`
# branch and the loser rebuilds its commit on the new tip and retries the push.

# Untrusted text (the comment body) only ever reaches shell through `env:`,
# never through `${{ }}` inside `run:`, so a comment can't inject commands.
jobs:
  add-user-to-cla-list:
    if: github.event.issue.pull_request
    runs-on: ubuntu-26.04
    steps:
      - name: Parse command
        id: command_check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # First line only, leading/trailing whitespace trimmed.
          FIRST_LINE="$(printf '%s\n' "$COMMENT_BODY" | head -n1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ "$FIRST_LINE" =~ ^/approve-cla([[:space:]]+(.*))?$ ]]; then
            ORG="${BASH_REMATCH[2]}"
            # Drop surrounding quotes if the maintainer quoted a multi-word org.
            ORG="${ORG#\"}"; ORG="${ORG%\"}"
            echo "should_proceed=true" >> "$GITHUB_OUTPUT"
            # Only a validated org name is ever written to step outputs.
            if [[ "$ORG" =~ ^[A-Za-z0-9][A-Za-z0-9\ ._\&-]{0,39}$ ]]; then
              echo "org=$ORG" >> "$GITHUB_OUTPUT"
              echo "org_valid=true" >> "$GITHUB_OUTPUT"
            else
              echo "org_valid=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Not an /approve-cla command, skipping"
            echo "should_proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get PR details
        if: steps.command_check.outputs.should_proceed == 'true'
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          AUTHOR=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .user.login)
          echo "PR author: $AUTHOR"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Checkout main branch
        if: steps.command_check.outputs.should_proceed == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check authorization
        if: steps.command_check.outputs.should_proceed == 'true'
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Simple allowlist of maintainers because running with a PAT doesn't seem safe or necessary.
          # Keep in sync with the maintainers team (@anchorageoss/maintainers) when it changes.
          AUTHORIZED_USERS=("vikstrous2" "prasanna-anchorage")

          if [[ " ${AUTHORIZED_USERS[*]} " == *" ${COMMENTER} "* ]]; then
            echo "is_maintainer=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_maintainer=false" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --body "Sorry @$COMMENTER, you are not authorized to run this command. Only maintainers can approve CLA signatures."
          fi

      - name: Explain usage
        if: steps.command_check.outputs.should_proceed == 'true' && steps.check.outputs.is_maintainer == 'true' && steps.command_check.outputs.org_valid != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          ORGS=$(grep -E '^# ' .cla-signed-users | sed 's/^# //' | grep -v -i 'contributor license agreement' | sed 's/^/- /' || true)
          gh pr comment "$PR_NUMBER" --body "Usage: \`/approve-cla <org>\`, for example \`/approve-cla Anchorage\`. The org picks the section of \`.cla-signed-users\` the author goes under (letters, digits, spaces and \`._&-\`, up to 40 characters). Existing sections:
          ${ORGS:-(none yet)}"

      - name: Add user to CLA file
        if: steps.command_check.outputs.should_proceed == 'true' && steps.check.outputs.is_maintainer == 'true' && steps.command_check.outputs.org_valid == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_USERNAME: ${{ steps.pr.outputs.author }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ORG: ${{ steps.command_check.outputs.org }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          BATCH_BRANCH="cla-signers-batch"

          [ -f .cla-signed-users ] || echo "# Contributor License Agreement Signers" > .cla-signed-users

          # Exact-line match; `grep -w` would treat `-` as a word break and
          # count `colton` as present because `colton-anchor` is.
          if grep -v '^#' .cla-signed-users | grep -Fxq "$AUTHOR_USERNAME"; then
            gh pr comment "$PR_NUMBER" --body "ℹ️ @${AUTHOR_USERNAME} is already in the CLA signers list."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MAIN_SHA=$(git rev-parse HEAD)

          # Another run may push the batch branch between our fetch and push;
          # the non-fast-forward push then fails and we redo it on the new tip.
          for ATTEMPT in 1 2 3 4 5; do
            if git ls-remote --exit-code --heads origin "$BATCH_BRANCH" > /dev/null 2>&1; then
              git fetch origin "$BATCH_BRANCH"
              git checkout -B "$BATCH_BRANCH" FETCH_HEAD
            else
              git checkout -B "$BATCH_BRANCH" "$MAIN_SHA"
            fi

            if grep -v '^#' .cla-signed-users | grep -Fxq "$AUTHOR_USERNAME"; then
              gh pr comment "$PR_NUMBER" --body "ℹ️ @${AUTHOR_USERNAME} is already pending approval in the CLA signers batch."
              exit 0
            fi

            # Insert the author at the end of the org's section, or start a new
            # `# <org>` section at the end of the file. Other lines are untouched.
            python3 - <<'PY'
          import os
          path, user, org = ".cla-signed-users", os.environ["AUTHOR_USERNAME"], os.environ["ORG"].strip()
          lines = open(path).read().splitlines()
          def is_header(l): return l.startswith("# ")
          def matches(l):
              name = l[2:].strip().lower()
              return name == org.lower() or name.startswith(org.lower() + " ")
          start = next((i for i, l in enumerate(lines) if is_header(l) and matches(l)), None)
          if start is None:
              while lines and not lines[-1].strip():
                  lines.pop()
              lines += ["", f"# {org}", user]
          else:
              end = next((j for j in range(start + 1, len(lines)) if is_header(lines[j])), len(lines))
              last = max((j for j in range(start + 1, end) if lines[j].strip() and not lines[j].startswith("#")), default=start)
              lines.insert(last + 1, user)
          open(path, "w").write("\n".join(lines) + "\n")
          PY

            git add .cla-signed-users
            git commit -m "chore: Add @${AUTHOR_USERNAME} to CLA signers list (${ORG})

          Approved by: @${COMMENTER}
          Related PR: #${PR_NUMBER}"
            if git push origin "$BATCH_BRANCH"; then
              break
            fi
            if [ "$ATTEMPT" -eq 5 ]; then
              echo "::error::Could not push to $BATCH_BRANCH after $ATTEMPT attempts"
              exit 1
            fi
            sleep $((ATTEMPT * 3))
          done

          EXISTING_PR=$(gh pr list --head "$BATCH_BRANCH" --base main --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr comment "$EXISTING_PR" --body "✅ Added @${AUTHOR_USERNAME} under ${ORG} (approved by @${COMMENTER} in PR #${PR_NUMBER})"
            gh pr comment "$PR_NUMBER" --body "✅ @${AUTHOR_USERNAME} has been added under ${ORG} to the CLA signers batch PR #${EXISTING_PR} by @${COMMENTER}. The CLA check will pass once the batch PR is merged."
          else
            # `gh pr create` prints the PR URL (…/pull/<n>); take the trailing number.
            # It fails if a concurrent run opened the batch PR first; fall back below.
            NEW_PR=$(gh pr create \
              --title "chore: Add CLA signers batch" \
              --body "This PR adds new CLA signers in batch to comply with repository rules.

            Recent additions:
            - @${AUTHOR_USERNAME} under ${ORG} (approved by @${COMMENTER} in PR #${PR_NUMBER})

            This PR will be updated automatically as more users are approved." \
              --head "$BATCH_BRANCH" \
              --base main \
              --label "cla" \
              | grep -oE '[0-9]+$' | head -1) || true
            if [ -n "$NEW_PR" ]; then
              gh pr comment "$PR_NUMBER" --body "✅ @${AUTHOR_USERNAME} has been added under ${ORG} to a new CLA signers batch PR #${NEW_PR} by @${COMMENTER}. The CLA check will pass once the batch PR is merged."
            else
              EXISTING_PR=$(gh pr list --head "$BATCH_BRANCH" --base main --json number --jq '.[0].number // empty')
              if [ -z "$EXISTING_PR" ]; then
                echo "::error::gh pr create failed and no open PR exists for $BATCH_BRANCH; @${AUTHOR_USERNAME} was pushed to the batch branch but no batch PR was opened"
                exit 1
              fi
              gh pr comment "$PR_NUMBER" --body "✅ @${AUTHOR_USERNAME} has been added under ${ORG} to the CLA signers batch PR #${EXISTING_PR} by @${COMMENTER}. The CLA check will pass once the batch PR is merged."
            fi
          fi
